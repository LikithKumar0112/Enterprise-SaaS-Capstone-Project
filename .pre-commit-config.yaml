repos:
    - repo: https://github.com/gitleaks/gitleaks
      rev: v8.18.0
      hooks:
        - id: gitleaks
    - repo: https://github.com/antonbabenko/pre-commit-terraform
      rev: v1.88.0
      hooks:
        - id: terraform_fmt
        - id: terraform_tflint
        - id: terraform_tfsec
          # Matches ci.yml's tfsec soft_fail posture (Phase 7): report, don't
          # block, on findings we've already reviewed and accepted (public
          # EKS endpoint - no VPN/bastion in this dev environment, etc).
          args: [--args=--soft-fail]
