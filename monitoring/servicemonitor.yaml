apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: enterprise-devops-app
  namespace: monitoring
  labels:
    release: kube-prometheus
spec:
  namespaceSelector:
    matchNames: ["default"]
  selector:
    matchLabels:
      app: enterprise-devops-app
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
