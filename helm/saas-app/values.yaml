image:
  repository: PLACEHOLDER_ECR_URL
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 3000

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 512Mi }

# Used only when autoscaling is disabled; otherwise the HPA owns the replica count.
replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

ingress:
  enabled: true

pdb:
  enabled: true
  minAvailable: 1

# IRSA: must match the trust policy of the eks-app-service-account-<environment> role.
serviceAccount:
  name: enterprise-devops-app
  roleArn: ""   # set at deploy time

networkPolicy:
  enabled: true
  monitoringNamespace: monitoring
  # Public subnets, where the ALB's ip-mode targets connect from.
  albSourceCidrs: []
  # Private subnets, where ElastiCache lives.
  redisCidrs: []

env:
  NODE_ENV: production
  REDIS_URL: ""        # set at deploy time; required
  PORT: "3000"
  TRUST_PROXY_HOPS: "1"
