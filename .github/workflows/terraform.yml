name: Terraform
on:
  pull_request:
    paths: ['terraform/**']

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend-config=backend/development.hcl
      - run: terraform validate
      - name: tfsec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        # Report findings without blocking the PR - same informational
        # posture as the Snyk scan in ci.yml. The current critical findings
        # (public EKS endpoint, open SG egress) are accepted trade-offs for
        # this dev environment (no VPN/bastion), not new regressions.
        with:
          soft_fail: true
      - run: terraform plan -no-color -var-file=environments/development.tfvars
