name: CD
on:
  push:
    branches: [develop, main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        run: |
          IMG=${{ steps.ecr.outputs.registry }}/enterprise-devops-app-development
          docker build -t $IMG:${{ github.sha }} ./app/src
          docker push $IMG:${{ github.sha }}

      - name: Deploy with Helm
        run: |
          aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME_DEV }} --region ${{ vars.AWS_REGION }}
          helm upgrade --install saas-app ./helm/saas-app -n default \
            -f ./helm/saas-app/values-dev.yaml \
            --set image.repository=${{ steps.ecr.outputs.registry }}/enterprise-devops-app-development \
            --set image.tag=${{ github.sha }} --wait --timeout 5m

      - name: Smoke test + auto-rollback
        run: |
          kubectl rollout status deployment/enterprise-devops-app -n default --timeout=180s \
            || { echo "Rollout failed — rolling back"; helm rollback saas-app -n default; exit 1; }

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # requires manual approval (set in GitHub env)
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, push & deploy (prod)
        run: |
          IMG=${{ steps.ecr.outputs.registry }}/enterprise-devops-app-development
          docker build -t $IMG:${{ github.sha }} ./app/src
          docker push $IMG:${{ github.sha }}
          aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME_DEV }} --region ${{ vars.AWS_REGION }}
          helm upgrade --install saas-app ./helm/saas-app -n default \
            --set image.repository=$IMG --set image.tag=${{ github.sha }} --wait --timeout 5m
