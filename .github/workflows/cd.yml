name: CD
on:
  push:
    branches: [develop, main]

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy-dev:
    needs: ci
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: development
      cluster-name: ${{ vars.EKS_CLUSTER_NAME_DEV }}
      values-file: values-dev.yaml
    secrets: inherit

  deploy-production:
    needs: ci
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production   # requires manual approval (set in GitHub env)
      cluster-name: ${{ vars.EKS_CLUSTER_NAME_PROD }}
      values-file: values-prod.yaml
    secrets: inherit
